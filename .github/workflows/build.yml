
- name: Configure Android SDK
  shell: bash
  run: |
    set -euo pipefail

    SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

    echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
    echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

    SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
      -type f -name sdkmanager | sort -V | tail -n 1)"

    if [ -z "$SDKMANAGER" ]; then
      echo "Android SDK Manager not found"
      exit 1
    fi

    yes | "$SDKMANAGER" \
      --sdk_root="$SDK_ROOT" --licenses || true

    "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
      "platform-tools" \
      "platforms;android-35" \
      "build-tools;35.0.0"
